<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="moonSilver" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E8ECF2"/>
      <stop offset="100%" stop-color="#B8C4D4"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle
    cx="50"
    cy="50"
    r="42"
    fill="url(#moonSilver)"
    filter="url(#glow)"
  />

  <circle
    cx="50"
    cy="50"
    r="42"
    fill="none"
    stroke="#C5CFE0"
    stroke-width="0.8"
    opacity="0.5"
  />
</svg>