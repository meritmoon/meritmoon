<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="100%" height="100%">
  <defs>
    <!-- Rich 3D Spherical Lunar Gradient (Zenith Top-Left Highlight & Bottom-Right Crescent Shadow) -->
    <radialGradient id="lunarSurfaceMed" cx="36%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F2F8F0"/>
      <stop offset="58%" stop-color="#D0E2CC"/>
      <stop offset="80%" stop-color="#A0BE9E"/>
      <stop offset="100%" stop-color="#6B8E67"/>
    </radialGradient>
  </defs>

  <!-- Luminous 3D Moon Sphere (Zero Border Gaps) -->
  <circle
    cx="42"
    cy="42"
    r="42"
    fill="url(#lunarSurfaceMed)"
  />

  <!-- Facial Features (Spacious, peaceful smiling eyes with sweet smile) -->
  <g id="mascot-face-meditating">
    <!-- Left Smiling Eye (Peaceful curved arch ⌒) -->
    <path
      d="M 22.5 31 Q 29 23 35.5 31"
      fill="none"
      stroke="#0D1C10"
      stroke-width="2.9"
      stroke-linecap="round"
    />

    <!-- Right Smiling Eye (Peaceful curved arch ⌒) -->
    <path
      d="M 48.5 31 Q 55 23 61.5 31"
      fill="none"
      stroke="#0D1C10"
      stroke-width="2.9"
      stroke-linecap="round"
    />

    <!-- Standout Sweet, Warm, Joyful Smile ◡ -->
    <path
      d="M 30 48 Q 42 59 54 48"
      fill="none"
      stroke="#0D1C10"
      stroke-width="3.3"
      stroke-linecap="round"
    />
  </g>
</svg>
