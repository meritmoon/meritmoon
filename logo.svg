<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Radiant Silver-Bright Lunar Gradient -->
    <radialGradient id="moonSilverLogo" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F5FAF3"/>
      <stop offset="55%" stop-color="#E4EEE2"/>
      <stop offset="80%" stop-color="#CAD9C7"/>
      <stop offset="100%" stop-color="#B2C7AF"/>
    </radialGradient>

    <!-- Radiant Moonlight Glow -->
    <filter id="glowLogo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Rosy Blush Filter -->
    <filter id="blushBlurLogo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Ambient Halo Ring -->
  <circle
    cx="50"
    cy="50"
    r="47"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="0.8"
    stroke-opacity="0.3"
  />

  <!-- Silver-Bright Moon Body -->
  <circle
    cx="50"
    cy="50"
    r="42"
    fill="url(#moonSilverLogo)"
    filter="url(#glowLogo)"
  />

  <!-- Crisp Lunar Edge -->
  <circle
    cx="50"
    cy="50"
    r="42"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="0.8"
    stroke-opacity="0.55"
  />

  <!-- Mascot Face -->
  <g id="logo-face">
    <!-- Left Eye with Catchlight -->
    <g>
      <circle cx="39" cy="45" r="4.2" fill="#0D1C10"/>
      <circle cx="37.8" cy="43.8" r="1.3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- Right Eye with Catchlight -->
    <g>
      <circle cx="61" cy="45" r="4.2" fill="#0D1C10"/>
      <circle cx="59.8" cy="43.8" r="1.3" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- Delicate Innocent Smile -->
    <path
      d="M 44.5 56 Q 50 60.5 55.5 56"
      fill="none"
      stroke="#0D1C10"
      stroke-width="2.1"
      stroke-linecap="round"
    />

    <!-- Left Rosy-Ruby Blush -->
    <ellipse
      cx="32"
      cy="52"
      rx="5.2"
      ry="2.8"
      fill="#E15F73"
      fill-opacity="0.38"
      filter="url(#blushBlurLogo)"
    />

    <!-- Right Rosy-Ruby Blush -->
    <ellipse
      cx="68"
      cy="52"
      rx="5.2"
      ry="2.8"
      fill="#E15F73"
      fill-opacity="0.38"
      filter="url(#blushBlurLogo)"
    />
  </g>
</svg>
